<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMind-Web | منصة الذكاء الاصطناعي الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        pre { background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 8px; overflow-x: auto; direction: ltr; text-align: left; margin-top: 8px; }
        code { font-family: Consolas, monospace; font-size: 0.9em; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- الشريط العلوي -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-2">
            <span class="text-2xl">💎</span>
            <h1 class="text-xl font-bold text-emerald-400">OmniMind-Web</h1>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <!-- قائمة النماذج المجانية -->
            <select id="modelSelect" class="bg-slate-900 border border-slate-600 text-sm rounded-lg px-3 py-2 text-emerald-300 focus:outline-none focus:border-emerald-500">
                <option value="deepseek/deepseek-r1:free">🔥 DeepSeek R1 (تفكير وبرمجة - مجاني)</option>
                <option value="deepseek/deepseek-chat-v3-0324:free">⚡ DeepSeek V3 (سريع وشامل - مجاني)</option>
                <option value="google/gemini-2.0-flash-exp:free">✨ Gemini 2.0 Flash (فائق السرعة - مجاني)</option>
                <option value="qwen/qwen-2.5-coder-32b-instruct:free">💻 Qwen 2.5 Coder 32B (مختص برمجة - مجاني)</option>
                <option value="meta-llama/llama-3.3-70b-instruct:free">🦙 Llama 3.3 70B (محادثة متقدمة - مجاني)</option>
            </select>

            <!-- زر إدخال المفتاح -->
            <input id="apiKeyInput" type="password" placeholder="ضع مفتاح OpenRouter API هنا..." 
                   class="bg-slate-900 border border-slate-600 text-sm rounded-lg px-3 py-2 w-64 focus:outline-none focus:border-emerald-500">
            <button onclick="saveKey()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg font-medium transition">
                حفظ المفتاح
            </button>
        </div>
    </header>

    <!-- منطقة المحادثة -->
    <main id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-5xl w-full mx-auto">
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-slate-300">
            👋 مرحباً بك في منصة <b>OmniMind-Web</b>. ضع مفتاح OpenRouter في الأعلى، واختر النموذج، وابدأ المحادثة أو البرمجة فوراً!
        </div>
    </main>

    <!-- منطقة كتابة الرسائل -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <div class="max-w-5xl mx-auto flex gap-3">
            <textarea id="userInput" rows="2" placeholder="اكتب سؤالك أو اطلب كتابة كود برمجي..." 
                      class="flex-1 bg-slate-900 border border-slate-600 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500 resize-none"></textarea>
            <button id="sendBtn" onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-6 rounded-xl font-bold text-white transition flex items-center justify-center">
                إرسال 🚀
            </button>
        </div>
    </footer>

    <script>
        const apiKeyInput = document.getElementById('apiKeyInput');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const modelSelect = document.getElementById('modelSelect');
        const sendBtn = document.getElementById('sendBtn');

        // استرجاع المفتاح المحفوظ
        if (localStorage.getItem('omnimind_api_key')) {
            apiKeyInput.value = localStorage.getItem('omnimind_api_key');
        }

        function saveKey() {
            localStorage.setItem('omnimind_api_key', apiKeyInput.value.trim());
            alert('تم حفظ مفتاح الـ API في متصفحك بنجاح!');
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            if (role === 'user') {
                div.className = 'bg-emerald-900/40 border border-emerald-700/50 p-4 rounded-xl ml-12 text-white';
                div.innerHTML = `<b>أنت:</b><div class="mt-1 whitespace-pre-wrap">${text}</div>`;
            } else {
                div.className = 'bg-slate-800 border border-slate-700 p-4 rounded-xl mr-12 text-slate-200';
                div.innerHTML = `<b class="text-emerald-400">🤖 ${modelSelect.options[modelSelect.selectedIndex].text}:</b><div class="mt-2 prose prose-invert max-w-none">${marked.parse(text)}</div>`;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                alert('يرجى وضع مفتاح OpenRouter API أولاً في الشريط العلوي!');
                return;
            }
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = 'جاري التفكير... ⏳';

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "OmniMind-Web"
                    },
                    body: JSON.stringify({
                        model: modelSelect.value,
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    appendMessage('bot', data.choices[0].message.content);
                } else {
                    appendMessage('bot', '⚠️ خطأ من المزود: ' + JSON.stringify(data.error?.message || data));
                }
            } catch (err) {
                appendMessage('bot', '❌ حدث خطأ في الاتصال: ' + err.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'إرسال 🚀';
            }
        }
    </script>
</body>
</html>
